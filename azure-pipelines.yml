# Azure DevOps Pipeline for Project Allocation System Backend
# App Service: pip-pas-backend-am
# Resource Group: AIP_Training_ModSol_RG

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - Project_Allocation_System/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: 'PAS-Backend-Variables' # Optional: Use variable group for secrets
  - name: buildConfiguration
    value: 'Release'
  - name: projectPath
    value: 'Project_Allocation_System/Project_Allocation_System.csproj'
  - name: appServiceName
    value: 'pip-pas-backend-am'
  - name: resourceGroup
    value: 'AIP_Training_ModSol_RG'
  - name: dotnetVersion
    value: '8.0.x'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build .NET Application'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion) SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build application'
            inputs:
              command: 'build'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish application'
            inputs:
              command: 'publish'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build'
              zipAfterPublish: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish build artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        displayName: 'Deploy to $(appServiceName)'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection' # Update with your service connection name
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/drop'
                    runtimeStack: 'DOTNETCORE|8.0'
                    startUpCommand: 'dotnet Project_Allocation_System.dll'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart App Service'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection' # Update with your service connection name
                    Action: 'Restart Azure App Service'
                    WebAppName: '$(appServiceName)'
                    ResourceGroupName: '$(resourceGroup)'
