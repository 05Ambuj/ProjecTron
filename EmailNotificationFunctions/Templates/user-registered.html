<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #007bff; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .button { display: inline-block; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Project Allocation System</h1>
        </div>
        <div class="content">
            <p>Hello {{FirstName}},</p>
            <p>Your account has been successfully created!</p>
            <p>You can now log in using your email: <strong>{{Email}}</strong></p>
            <p>Your role: <strong>{{Role}}</strong></p>
            <a href="{{LoginUrl}}" class="button">Login to System</a>
            <p>If you have any questions, please contact your administrator.</p>
            <p>Best regards,<br>Project Allocation System Team</p>
        </div>
    </div>
</body>
</html>
