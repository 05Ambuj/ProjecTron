<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { background-color: #6c757d; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .stat-box { background-color: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .stat-item { display: inline-block; margin: 10px 20px; }
        .stat-number { font-size: 24px; font-weight: bold; color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background-color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weekly Project Report</h1>
            <p>{{ReportDate}}</p>
        </div>
        <div class="content">
            <p>Hello {{RecipientName}},</p>
            <p>Here is your weekly project summary:</p>
            
            <div class="stat-box">
                <div class="stat-item">
                    <div class="stat-number">{{TotalTasks}}</div>
                    <div>Total Tasks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">{{CompletedTasks}}</div>
                    <div>Completed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">{{OverdueTasks}}</div>
                    <div>Overdue</div>
                </div>
            </div>

            <h3>Upcoming Deadlines (Next 7 Days)</h3>
            {{UpcomingDeadlines}}

            <p>Best regards,<br>Project Allocation System</p>
        </div>
    </div>
</body>
</html>
