<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #28a745; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .info-box { background-color: white; padding: 15px; border-left: 4px solid #28a745; margin: 15px 0; }
        .button { display: inline-block; padding: 12px 24px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>You've been added to a project</h1>
        </div>
        <div class="content">
            <p>Hello {{RecipientName}},</p>
            <p>You have been added to the following project:</p>
            <div class="info-box">
                <p><strong>Project:</strong> {{ProjectName}}</p>
                <p><strong>Team:</strong> {{TeamName}}</p>
                <p><strong>Added by:</strong> {{AddedByName}}</p>
            </div>
            <a href="{{ProjectUrl}}" class="button">View Project</a>
            <p>Best regards,<br>Project Allocation System</p>
        </div>
    </div>
</body>
</html>
