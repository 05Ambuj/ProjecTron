<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #007bff; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .info-box { background-color: white; padding: 15px; border-left: 4px solid #007bff; margin: 15px 0; }
        .priority-high { border-left-color: #ffc107; }
        .priority-critical { border-left-color: #dc3545; }
        .button { display: inline-block; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Task Assigned</h1>
        </div>
        <div class="content">
            <p>Hello {{AssignedToName}},</p>
            <p>You have been assigned a new task:</p>
            <div class="info-box {{PriorityClass}}">
                <p><strong>Task:</strong> {{TaskTitle}}</p>
                <p><strong>Task Code:</strong> {{TaskCode}}</p>
                <p><strong>Project:</strong> {{ProjectName}}</p>
                <p><strong>Priority:</strong> {{Priority}}</p>
                <p><strong>Due Date:</strong> {{DueDate}}</p>
                <p><strong>Assigned by:</strong> {{AssignerName}}</p>
            </div>
            <a href="{{TaskUrl}}" class="button">View Task</a>
            <p>Best regards,<br>Project Allocation System</p>
        </div>
    </div>
</body>
</html>
